<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <link rel="stylesheet" type="text/css" href="style.css">
      <title>Please write your name here</title>
      <!-- This will be replaced with the actual name of the publication later.  -->
      <!-- Helpful meta tags to fight GitHub aggresive caching-->
      <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
      <meta http-equiv="Pragma" content="no-cache" />
      <meta http-equiv="Expires" content="0" />
   </head>
   <body>
      <div class="home-container">
         <header>
            <a class="logo-link" href="index.html">
               <h1><img class="logo" src="logo.svg" alt="Placeholder Logo"></h1>
            </a>
            <nav class="site-nav">
               <ul>
                  <li><a href="#">Coastal Trails</a></li>
                  <li><a href="#">Mountainous Trails</a></li>
                  <li><a href="#">Explore the Parks</a></li>
                  <li><a href="photogallery.html">Photography</a></li>
                  <li><a href="#">About Us</a></li>
               </ul>
            </nav>
         </header>
         <main class="newsletter-signup">
            <h2>Subscribe to our newsletter</h2>
            <p>Sign up to receive the latest stories, photo updates, and travel tips.</p>
            <form action="#" method="post">
               <label for="first-name">First name</label>
               <input type="text" id="first-name" name="first-name" required>
               <label for="last-name">Last name</label>
               <input type="text" id="last-name" name="last-name" required>
               <label for="email">Email address</label>
               <input type="email" id="email" name="email" required>
               <fieldset>
                  <legend>Newsletter type</legend>
                  <label>
                  <input type="checkbox" name="newsletter-type" value="stories">
                  Stories and trail guides
                  </label>
                  <label>
                  <input type="checkbox" name="newsletter-type" value="photos">
                  Photography updates
                  </label>
                  <label>
                  <input type="checkbox" name="newsletter-type" value="events">
                  Event and trip alerts
                  </label>
               </fieldset>
               <button type="submit">Subscribe</button>
            </form>
         </main>
         <footer>
            <p>All rights reserved.</p>
         </footer>
      </div>
   </body>
</html>
